<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff"><title>LEGO splash</title>
<style>
:root{color-scheme:light;--bg:#ffffff}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg)}
.splash{position:fixed;inset:0;display:grid;place-items:center;background:#ffffff;z-index:9999;transition:opacity .3s ease,visibility .3s ease}
.splash.done{opacity:0;visibility:hidden;pointer-events:none}
.logo{width:min(65vw,260px);height:auto;overflow:visible;transform-origin:50% 50%;animation:logo-in 2.4s cubic-bezier(.2,.7,.2,1) both}
.head{transform-box:fill-box;transform-origin:center;animation:head-move 2.4s ease-in-out both}
.color{fill:#fff;animation:paint 2.4s ease-out both}.stud-color{animation:stud-paint 2.4s ease-out both}.base-color{animation:base-paint 2.4s ease-out both}.shine{opacity:0;animation:shine 2.4s ease-out both}.face{opacity:0;animation:face-in 2.4s ease-out both}
.left-eye,.right-eye{transform-box:fill-box;transform-origin:center}.left-eye{animation:left-blink 2.4s both}.right-eye{animation:right-blink 2.4s both}.normal-mouth{animation:normal-smile 2.4s both}.wink-eye,.tongue-face{opacity:0;animation:tongue-out 2.4s both}.shade{opacity:0;animation:shine 2.4s both}.brow{opacity:0;animation:face-in 2.4s both}
@keyframes paint{0%,22%{fill:#fff}57%,100%{fill:#fec818}}
@keyframes stud-paint{0%,22%{fill:#fff}57%,100%{fill:#fec818}}
@keyframes base-paint{0%,22%{fill:#fff}57%,100%{fill:#fec818}}
@keyframes shine{0%,35%{opacity:0}70%,100%{opacity:1}}
@keyframes face-in{0%,43%{opacity:0}60%,100%{opacity:1}}
@keyframes logo-in{0%{opacity:0;transform:scale(.78)}17%{opacity:1;transform:scale(1)}58%{transform:scale(1.08)}73%{transform:scale(.96)}88%,100%{transform:scale(1)}}
@keyframes head-move{0%,24%{transform:rotate(0deg)}48%{transform:rotate(-12deg)}67%{transform:rotate(-7deg)}83%,100%{transform:rotate(-10deg)}}
@keyframes left-blink{0%,55%,95%,100%{opacity:1;transform:scaleY(1)}61%,85%{opacity:0;transform:scaleY(.15)}}
@keyframes right-blink{0%,48%,100%{transform:scaleY(1)}51%{transform:scaleY(.1)}}
@keyframes normal-smile{0%,53%,92%,100%{opacity:1}59%,87%{opacity:0}}
@keyframes tongue-out{0%,53%,92%,100%{opacity:0}60%,86%{opacity:1}}

@media(prefers-reduced-motion:reduce){.logo,.head,.color,.shine,.face,.left-eye,.right-eye,.normal-mouth,.wink-eye,.tongue-face,.shade,.brow{animation:none!important}.color{fill:#fec818}.stud-color{fill:#fec818}.base-color{fill:#fec818}.shine,.face,.brow,.shade{opacity:1}.wink-eye,.tongue-face{opacity:0}.splash{transition:none}}
.demo{min-height:100dvh;display:grid;place-items:center;padding:2rem;font:500 1rem system-ui,sans-serif;color:#191919;text-align:center}.demo button{border:2px solid #111;border-radius:12px;background:#ffd804;padding:.8rem 1.2rem;font:inherit;cursor:pointer}
</style>
</head>
<body>
<div class="splash" id="splash" role="status" aria-label="Loading application">
<svg class="logo" viewBox="0 0 100 100" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
 <defs>
  <clipPath id="body-clip"><path d="M75.934 84.288c6.301 0 11.43-5.128 11.43-11.431v-40.21c0-6.301-5.129-11.429-11.43-11.429H24.066c-6.303 0-11.43 5.128-11.43 11.429v40.21c0 6.303 5.127 11.431 11.43 11.431h51.868z"/></clipPath>
  <clipPath id="stud-clip"><path d="M67.807 8.535c0-1.279-1.037-2.318-2.316-2.318H34.509c-1.279 0-2.318 1.04-2.318 2.318v9.725h35.616V8.535z"/></clipPath>
 </defs>
 <g class="head">
  <!-- Original source geometry, adapted into separate animatable layers -->
  <path class="color stud-color" d="M67.807 8.535c0-1.279-1.037-2.318-2.316-2.318H34.509c-1.279 0-2.318 1.04-2.318 2.318v9.725h35.616V8.535z"/>
  <path class="color" d="M75.934 84.288c6.301 0 11.43-5.128 11.43-11.431v-40.21c0-6.301-5.129-11.429-11.43-11.429H24.066c-6.303 0-11.43 5.128-11.43 11.429v40.21c0 6.303 5.127 11.431 11.43 11.431h51.868z"/>
  <rect class="color base-color" x="26.566" y="87.244" width="46.866" height="5.883"/>
  <!-- Reference palette and fixed-position facets; no moving color overlays. -->
  <g clip-path="url(#stud-clip)" class="shine">
   <path fill="#ffdb73" d="M35 4H40V20H35Z"/>
   <path fill="#fec818" d="M40 4H70V20H40Z"/>
  </g>
  <g clip-path="url(#body-clip)" class="shine">
   <!-- Right-side shadow is a single continuous amber facet. -->
   <path fill="#efb81e" d="M70 22Q81 24 84 33L84 75Q83 81 76 83L45 84Q69 79 73 66Q76 57 76 37Q76 29 70 22Z"/>
   <!-- Tall pale left reflection, tucked behind the bright center. -->
   <path fill="#ffdb73" d="M23 22Q17 26 15 34L15 72Q15 82 29 84L32 84Q24 78 23 69L23 29Q23 24 26 22Z"/>
   <path fill="#fff5bf" d="M20 27Q23 23 26 27Q28 31 24 34Q21 36 19 33Q18 30 20 27Z"/>
   <path fill="#fff5bf" d="M18 64Q20 61 21 67L22 73Q23 77 29 81Q34 84 30 84Q17 81 17 73L17 67Q17 65 18 64Z"/>
   <!-- Subtle upper-right light rim and bottom-right glint. -->
   <path fill="#ffdb73" d="M73 23Q85 25 86 37L86 72Q86 81 78 83L67 85Q65 85 70 83Q84 80 84 72L84 37Q84 29 73 23Z"/>
   <path fill="#fff5bf" d="M68 83Q77 82 82 78Q78 84 68 84Z"/>
  </g>
  <path d="M76.393 96.084v-8.852c7.721-.242 13.928-6.596 13.928-14.375v-40.21c0-7.932-6.455-14.387-14.387-14.387h-5.17V8.535c0-2.909-2.367-5.275-5.273-5.275H34.509c-2.909 0-5.275 2.366-5.275 5.275v9.725h-5.168c-7.933 0-14.387 6.455-14.387 14.387v40.21c0 7.779 6.208 14.133 13.929 14.375v8.852h52.785zM73.432 93.127H26.566v-5.883h46.866v5.883zM32.191 8.535c0-1.279 1.039-2.318 2.318-2.318H65.49c1.279 0 2.316 1.04 2.316 2.318v9.725H32.191V8.535zM12.636 72.857v-40.21c0-6.301 5.127-11.429 11.43-11.429h51.868c6.301 0 11.43 5.128 11.43 11.429v40.21c0 6.303-5.129 11.431-11.43 11.431H24.066c-6.303 0-11.43-5.128-11.43-11.431z" fill="#3c3c3b"/>
  <g class="face" fill="#3c3c3b">
   <g class="left-eye"><circle cx="37.744" cy="48.038" r="4.153"/><circle cx="36.5" cy="46.8" r="1.5" fill="#fff"/></g>
   <g class="right-eye"><circle cx="62.256" cy="48.038" r="4.153"/><circle cx="61" cy="46.8" r="1.5" fill="#fff"/></g>
   <path class="normal-mouth" d="M36.82 62.893c-.673.675-.67 1.769.005 2.439 3.646 3.633 8.436 5.449 13.226 5.449s9.581-1.816 13.223-5.449c.676-.671.68-1.765.008-2.439-.674-.675-1.766-.676-2.441-.005-5.949 5.928-15.629 5.928-21.581 0-.676-.671-1.767-.67-2.44.005z"/>
   <g class="wink-eye"><path d="M31 47q5-8 11-3q-7-1-11 5Z"/></g>
   <g class="tongue-face">
    <path d="M34 62Q49 67 66 57Q66 70 52 73Q40 75 34 62Z" fill="#3c3c3b"/>
    <path d="M47 69Q51 68 55 65L58 77Q57 83 51 83Q46 83 45 78Z" fill="#ef665b" stroke="#3c3c3b" stroke-width="1.6"/>
    <path d="M51 69L53 77" stroke="#9b3536" stroke-width="1.4" fill="none"/>
    <path d="M47 78q4 4 9 0" stroke="#ffb6a3" stroke-width="1.2" fill="none"/>
   </g>
   <path class="brow" d="M31 40q4-6 10-5M57 35q5-6 12-2" fill="none" stroke="#3c3c3b" stroke-width="2.4" stroke-linecap="round"/>
  </g>
 </g>
</svg>
</div>

<script>
const reduce=matchMedia('(prefers-reduced-motion: reduce)');
function complete(){parent.postMessage({type:'collector-splash-animation-complete'},location.origin)}
let finish=setTimeout(complete,reduce.matches?250:2750);
reduce.addEventListener('change',event=>{if(event.matches){clearTimeout(finish);complete()}});
</script>
</body></html>
