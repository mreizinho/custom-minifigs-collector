<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff"><title>LEGO splash</title>
<style>
:root{color-scheme:light;--bg:#ffffff}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg)}
.splash{position:fixed;inset:0;display:grid;place-items:center;background:#ffffff;z-index:9999;transition:opacity .3s ease,visibility .3s ease}
.splash.done{opacity:0;visibility:hidden;pointer-events:none}
.logo{width:min(65vw,260px);height:auto;overflow:visible;transform-origin:50% 50%;animation:logo-in 2.4s cubic-bezier(.2,.7,.2,1) both}
.head{transform-box:fill-box;transform-origin:center;animation:head-move 2.4s ease-in-out both}
.color{fill:#fff;animation:paint 2.4s ease-out both}.stud-color{animation:stud-paint 2.4s ease-out both}.base-color{animation:base-paint 2.4s ease-out both}.shine{opacity:0;animation:shine 2.4s ease-out both}.face{opacity:0;animation:face-in 2.4s ease-out both}
.left-eye,.right-eye{transform-box:fill-box;transform-origin:center}.left-eye{animation:left-blink 2.4s both}.right-eye{animation:right-blink 2.4s both}.normal-mouth{animation:normal-smile 2.4s both}.wink-eye,.tongue-face{opacity:0;animation:tongue-out 2.4s both}.shade{opacity:0;animation:shine 2.4s both}.brow{opacity:0;animation:face-in 2.4s both}
@keyframes paint{0%,22%{fill:#fff}57%,100%{fill:#fec818}}
@keyframes stud-paint{0%,22%{fill:#fff}57%,100%{fill:#fec818}}
@keyframes base-paint{0%,22%{fill:#fff}57%,100%{fill:#fec818}}
@keyframes shine{0%,35%{opacity:0}70%,100%{opacity:1}}
@keyframes face-in{0%,43%{opacity:0}60%,100%{opacity:1}}
@keyframes logo-in{0%{opacity:0;transform:scale(.78)}17%{opacity:1;transform:scale(1)}58%{transform:scale(1.08)}73%{transform:scale(.96)}88%,100%{transform:scale(1)}}
@keyframes head-move{0%,24%{transform:rotate(0deg)}48%{transform:rotate(-12deg)}67%{transform:rotate(-7deg)}83%,100%{transform:rotate(-10deg)}}
@keyframes left-blink{0%,55%,95%,100%{opacity:1;transform:scaleY(1)}61%,85%{opacity:0;transform:scaleY(.15)}}
@keyframes right-blink{0%,48%,100%{transform:scaleY(1)}51%{transform:scaleY(.1)}}
@keyframes normal-smile{0%,53%,92%,100%{opacity:1}59%,87%{opacity:0}}
@keyframes tongue-out{0%,53%,92%,100%{opacity:0}60%,86%{opacity:1}}

@media(prefers-reduced-motion:reduce){.logo,.head,.color,.shine,.face,.left-eye,.right-eye,.normal-mouth,.wink-eye,.tongue-face,.shade,.brow{animation:none!important}.color{fill:#fec818}.stud-color{fill:#fec818}.base-color{fill:#fec818}.shine,.face,.brow,.shade{opacity:1}.wink-eye,.tongue-face{opacity:0}.splash{transition:none}}
.demo{min-height:100dvh;display:grid;place-items:center;padding:2rem;font:500 1rem system-ui,sans-serif;color:#191919;text-align:center}.demo button{border:2px solid #111;border-radius:12px;background:#ffd804;padding:.8rem 1.2rem;font:inherit;cursor:pointer}
</style>
</head>

<script>
const reduce=matchMedia('(prefers-reduced-motion: reduce)');
function complete(){parent.postMessage({type:'collector-splash-animation-complete'},location.origin)}
let finish=setTimeout(complete,reduce.matches?250:2750);
reduce.addEventListener('change',event=>{if(event.matches){clearTimeout(finish);complete()}});
</script>
