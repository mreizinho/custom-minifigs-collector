:root{color-scheme:light;--head-size: min(76vw, 520px);--shift-x:0px;--shift-y:0px}
*{box-sizing:border-box}body{margin:0;background:#fff;color:#262626;font:15px/1.5 system-ui,-apple-system,sans-serif}
.stage{position:relative;min-height:100svh;display:grid;place-items:center;overflow:hidden;background:white}
/* Keep the initial web frame identical to the Android icon. */
.head{width:var(--head-size);height:auto;max-height:85svh;overflow:visible;transform:translate(var(--shift-x),var(--shift-y));transform-origin:50% 54%;will-change:transform}
#color-common,#face-two,#face-three,#final-outline{transition:none}
/* Prevent the final Splash 1 outline from flashing before animations initialize. */
#final-outline{opacity:0}
/* Face layers switch together at the bounce peak, avoiding a visible dissolve. */
#face-two,#face-three{transform-box:fill-box;transform-origin:center;will-change:opacity,transform}
.head.play #color-common{animation:colored 2.35s ease-in-out both}
.head.play #face-two{animation:second 2.35s cubic-bezier(.45,0,.2,1) both}
.head.play #face-three{animation:third 2.35s cubic-bezier(.45,0,.2,1) both}
.head.play #final-outline{animation:final 2.35s ease-in-out both}
.head.play{animation:head-bounce 2.35s linear both}
/* 2 -> 3: synchronized near-instant switch at 36%; 3 -> 1: 65-79%. */
@keyframes colored{0%,65%{opacity:1}79%,100%{opacity:0}}
@keyframes second{
  0%,35.9%{opacity:1;transform:translateY(0) scale(1)}
  36%,100%{opacity:0;transform:translateY(0) scale(1)}
}
@keyframes third{
  0%,35.9%{opacity:0;transform:translateY(0) scale(1)}
  36%,65%{opacity:1;transform:translateY(0) scale(1)}
  79%,100%{opacity:0;transform:translateY(2px) scale(.985)}
}
@keyframes final{0%,65%{opacity:0}79%,100%{opacity:1}}
/* Based on the user's reference: lift -> tilt -> soft landing -> rebound. */
@keyframes head-bounce{
  0%,22%{transform:translate(var(--shift-x),var(--shift-y)) translateY(0) rotate(0deg) scale(1)}
  36%{transform:translate(var(--shift-x),var(--shift-y)) translateY(-10px) rotate(-3deg) scale(1.025)}
  45%{transform:translate(var(--shift-x),var(--shift-y)) translateY(2px) rotate(1.8deg) scale(.992)}
  53%{transform:translate(var(--shift-x),var(--shift-y)) translateY(-3px) rotate(-.7deg) scale(1.008)}
  62%{transform:translate(var(--shift-x),var(--shift-y)) translateY(0) rotate(0deg) scale(1)}
  73%{transform:translate(var(--shift-x),var(--shift-y)) translateY(-8px) rotate(3deg) scale(1.024)}
  83%{transform:translate(var(--shift-x),var(--shift-y)) translateY(2px) rotate(-1.5deg) scale(.994)}
  91%{transform:translate(var(--shift-x),var(--shift-y)) translateY(-2px) rotate(.5deg) scale(1.005)}
  100%{transform:translate(var(--shift-x),var(--shift-y)) translateY(0) rotate(0deg) scale(1)}
}
.controls{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);width:min(90vw,440px);background:#fffefdeb;border:1px solid #e4e4e4;border-radius:14px;padding:12px 16px;box-shadow:0 8px 30px #0000000d}
.controls label{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:7px 0;font-size:12px}.controls input{width:55%}.controls button{border:0;border-radius:8px;background:#242424;color:white;padding:8px 14px;cursor:pointer}.controls .actions{display:flex;align-items:center;justify-content:space-between}.note{font-size:11px;color:#666;margin:8px 0 0}
@media(prefers-reduced-motion:reduce){.head.play,.head.play #color-common,.head.play #face-two,.head.play #face-three,.head.play #final-outline{animation:none!important;transform:none!important}.head #color-common,.head #face-two,.head #face-three{opacity:0!important}.head #final-outline{opacity:1!important}}
