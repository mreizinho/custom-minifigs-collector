/* Match the Android launch head: video calibration adds 4% size and
   compensates for the small vertical shift into the web viewport. */
.mobile-launch .stage{width:260.47387px;max-height:none;transform:translate(0,calc(.2650725px + .7svh))}
@font-face{font-family:'Barlow Condensed';font-style:normal;font-weight:400;font-display:swap;src:url('barlow-condensed-latin-400.woff2') format('woff2')}
.mobile-ending{display:none}
.mobile-launch .mobile-ending{display:block;position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity .25s ease;font:400 30px/36px 'Barlow Condensed',sans-serif;letter-spacing:.65px;text-transform:uppercase;text-align:center;color:#252624}
.mobile-launch .mobile-ending.is-visible{opacity:1}
.mobile-ending span{position:absolute;left:0;right:0;white-space:nowrap}
.mobile-ending-top{top:6px}
.mobile-ending-bottom{top:218px;color:#252624;font-size:46.5px;line-height:56px}
.mobile-launch .mobile-ending span{opacity:0;transform:scale(.6);transform-origin:center;transition:transform .45s cubic-bezier(.16,1,.3,1),opacity .3s ease}
.mobile-launch .mobile-ending.is-visible span{opacity:1;transform:scale(1)}
@media(prefers-reduced-motion:reduce){.mobile-launch .mobile-ending,.mobile-launch .mobile-ending span{transition:none}.mobile-launch .mobile-ending span{transform:none}}
.desktop-ending{display:none}
.desktop-launch .desktop-ending{display:block;position:absolute;inset:0;pointer-events:none;text-align:center;white-space:nowrap;color:#252624;font:400 clamp(32px,10vmin,84px)/1.2 'Barlow Condensed',sans-serif;letter-spacing:.65px;text-transform:uppercase}
.desktop-ending span{position:absolute;left:0;right:0}

@media(prefers-reduced-motion:reduce){.desktop-launch .desktop-ending span{transition:none;transform:none}}
/* The face sequence shares the original artwork and ending with the fuse. */
.face-splash #frame1 { animation-name: face-frame1; animation-duration: var(--yellow-duration); }
.face-splash #frame2, .face-splash #frame3,
.face-splash #frame4, .face-splash #frame5 { display: none; }
.face-splash #frame6 { animation-name: face-frame6; animation-duration: var(--yellow-duration); }
.face-splash #flash {
  animation-name: final-flash;
  animation-duration: var(--yellow-duration);
}
.face-splash .head-motion {
  --yellow-duration: 4.64s;
  --duration: 5.9334s;
  animation-name: face-bounce;
}
.splash-face { display: none; }
.face-splash .splash-face {
  display: inline;
  animation: face-frame6 var(--yellow-duration) steps(1, end) both;
}
.splash-mouth {
  animation: smile-mouth calc(var(--duration) * .058647) ease-in-out
    calc(var(--duration) * .75074) both;
}
.splash-eye {
  transform-box: fill-box;
  transform-origin: center;
  animation: blink-twice var(--duration) ease-in-out both;
}

@keyframes face-frame1 {
  0% { opacity: 1; }
  67%, 100% { opacity: 0; }
}
.yellow-expression { display: none; }
.face-splash .yellow-expression {
  display: inline;
  animation: yellow-expression var(--yellow-duration) steps(1, end) both;
}
.yellow-expression-ink { animation: yellow-ink var(--yellow-duration) ease-in both; }
@keyframes yellow-expression {
  0% { opacity: 1; }
  67%, 100% { opacity: 0; }
}
@keyframes yellow-ink {
  0%, 23% { opacity: 0; }
  26%, 100% { opacity: 1; }
}
@media (prefers-reduced-motion: reduce) {
  .face-splash .yellow-expression { display: none; }
}
@keyframes face-frame6 {
  0%, 66.99% { opacity: 0; }
  67%, 100% { opacity: 1; }
}
@keyframes final-flash {
  0%, 65.3% { opacity: 0; }
  66.1% { opacity: .25; }
  67% { opacity: 1; }
  67.6% { opacity: .8; }
  69%, 100% { opacity: 0; }
}
@keyframes blink-twice {
  0%, 66.276%, 69.209%, 72.141%, 75.074%, 100% { transform: scaleY(1); }
  67.742%, 73.607% { transform: scaleY(.09); }
}

<g id="flash"><circle cx="495" cy="500" r="360"/></g></g></svg><div class="mobile-ending" aria-hidden="true"><span class="mobile-ending-top">Custom Minifigs</span><span class="mobile-ending-bottom">Collector</span></div><div class="desktop-ending" aria-hidden="true"><span class="desktop-ending-top">Custom Minifigs</span><span class="desktop-ending-bottom">Collector</span></div></div></main><script>
(()=>{
 if (document.documentElement?.classList.contains('face-splash')) return;
 const stage=document.getElementById('stage');

 let raf=0;
 function play(){
  cancelAnimationFrame(raf);
  const path=stage.querySelector('#fuse'), spark=stage.querySelector('#spark');
  const trail=stage.querySelector('#fuseTrail'), gradient=stage.querySelector('#fuseTrailGradient');
  trail.setAttribute('d',path.getAttribute('d'));
  const length=path.getTotalLength();
  // Keep the trail about 100 CSS pixels long on both mobile and desktop.
  const svgBox=path.ownerSVGElement.viewBox.baseVal, svgBounds=path.ownerSVGElement.getBoundingClientRect();
  const trailLength=100/Math.max(.001,Math.min(svgBounds.width/svgBox.width,svgBounds.height/svgBox.height));
  trail.style.opacity='0';
  path.style.strokeDasharray=String(length);
  path.style.strokeDashoffset=String(length);
  path.style.opacity='0'; spark.style.opacity='0';
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const start=performance.now(), begin=4030, duration=868;
  function tick(now){
   const elapsed=now-start;
   if(elapsed>=begin && elapsed<begin+duration){
    const progress=(elapsed-begin)/duration, distance=progress*length;
    path.style.opacity='1'; path.style.strokeDashoffset=String(length-distance);
    const pt=path.getPointAtLength(distance);
    const tailLength=Math.min(trailLength,distance), tailStart=distance-tailLength;
    const tail=path.getPointAtLength(tailStart);
    gradient.setAttribute('x1',tail.x); gradient.setAttribute('y1',tail.y);
    gradient.setAttribute('x2',pt.x); gradient.setAttribute('y2',pt.y);
    trail.style.strokeDasharray=tailLength+' '+length;
    trail.style.strokeDashoffset=String(-tailStart);
    trail.style.opacity=tailLength>0?'1':'0';
    spark.setAttribute('transform',`translate(${pt.x} ${pt.y})`);
    spark.style.opacity='1';
   }else if(elapsed>=begin+duration){
    path.style.strokeDashoffset='0';
    path.style.opacity=elapsed<5084?'1':'0';
    spark.style.opacity='0'; trail.style.opacity='0';
   }
   if(elapsed<6200)raf=requestAnimationFrame(tick);
  }
  raf=requestAnimationFrame(tick);
 }

 play();
})();
</script><script>
(() => {
  const motion = document.querySelector('.head-motion');
  const mobile = document.documentElement.classList.contains('mobile-launch');
  const desktop = document.documentElement.classList.contains('desktop-launch');
  const ending = document.querySelector(mobile ? '.mobile-ending' : '.desktop-ending');
  const reduced = matchMedia('(prefers-reduced-motion: reduce)');
  let sent = false, endingStarted = false, endingTimer;
  const complete = () => {
    if (sent) return;
    sent = true;
    clearTimeout(endingTimer);
    parent.postMessage({type: 'collector-splash-animation-complete'}, location.origin);
  };
  const finishAnimation = () => {
    if ((!mobile && !desktop) || reduced.matches) { complete(); return; }
    if (endingStarted) return;
    endingStarted = true;
    const faceSplash = document.documentElement.classList.contains('face-splash');
    ending.classList.add('is-visible');
    endingTimer = setTimeout(complete, faceSplash ? 1500 : 1200);
  };
  motion.addEventListener('animationstart', event => {
    if (event.animationName === 'smile-mouth') finishAnimation();
  });
  motion.addEventListener('animationend', event => {
    if (event.target === motion && ['bounce', 'face-bounce'].includes(event.animationName)) finishAnimation();
  });
  if (reduced.matches) queueMicrotask(complete);
  reduced.addEventListener('change', event => { if (event.matches) complete(); });
})();
</script></body></html>
